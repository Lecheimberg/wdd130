<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for trip reservations, questions, and adventure planning help.">
    <meta name="author" content="Lucas Perez Echeimberg">
    <title>Contact White Water Rafting | Reservations & Questions</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-intro">
            <h1>White Water Rafting Company</h1>

            <address>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
            </address>
        </section>

        <section class="contact-main">
            <div class="map-embed">
                <iframe src="https://www.google.com/maps?q=Moab%2C%20Utah&output=embed"
                  title="Google map showing White Water Rafting location" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="contact-form">
                <h2>Send Us a Message</h2>

                <form>
                    <div class="form-row">
                        <label for="fullname">Name</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-row">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail"
                          placeholder="Placeholder" required>
                    </div>

                    <fieldset class="form-group">
                        <legend>Message Purpose</legend>

                        <div class="radio-option">
                            <input type="radio" id="general-inquiry" name="purpose"
                              value="general-inquiry" required>
                            <label for="general-inquiry">General Inquiry</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="reservation-question" name="purpose"
                              value="reservation-question">
                            <label for="reservation-question">Reservation Question</label>
                        </div>

                        <div class="radio-option">
                            <input type="radio" id="website-suggestion" name="purpose"
                              value="website-suggestion">
                            <label for="website-suggestion">Website Suggestion</label>
                        </div>
                    </fieldset>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Type here"
                          required></textarea>
                    </div>

                    <div class="form-row checkbox-row">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="team-section">
            <h2>We Are Here to Serve You</h2>

            <div class="team-gallery">
                <figure>
                    <img src="images/rafting1.jpg" alt="River guide standing by the water">
                    <figcaption>Emma Carter — Lead Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting2.jpg" alt="Rafting team member smiling outdoors">
                    <figcaption>Lucas Bennett — Safety Instructor</figcaption>
                </figure>

                <figure>
                    <img src="images/rafting3.jpeg" alt="Team member standing with rafting gear">
                    <figcaption>Sophia Reed — Trip Coordinator</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Lucas Perez Echeimberg</p>

        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer">
                <img src="images/twitter.png" alt="Twitter">
            </a>

            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.jpg" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>

</html>
